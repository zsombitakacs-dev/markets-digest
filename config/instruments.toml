# Every instrument the pipeline tracks. One [[instrument]] block each.
#
#   id               short name used in data files
#   name, group      what readers see
#   source, symbol   where the number comes from (see SOURCES in pipeline/fetch.py)
#   fallback_source,
#   fallback_symbol  used only if the primary source fails
#   kind             "price" (daily change in %) or "rate" (yields and spreads: change in basis points)
#   market           trading hours, from the [market.*] tables at the end; no market = a figure
#                    published once a day, so its state is always "closed"
#   history_symbol   only where past daily closes need a different symbol than the live price
#   chart            a page where a reader can see a chart or the official figure
#   available        false = no free source; kept here, with a note, so the gap is visible
#   note             anything a reader of the data should know
#
# Every symbol was checked with a real fetch on 2026-11-20.

