# Every 5 minutes on weekdays, 07:00-21:00 UTC: fetch prices, recalculate, deploy the
# dashboard. Normally nothing is committed: the newest latest.json is carried from run to run in the
# Actions cache instead (see "state" below), so the data repo only gets a few commits a day.
# One exception, the digest backup: between 14:30 and 14:40 London, if the pre-digest run has not
# committed today's data yet, one intraday run commits latest.json and the email tables itself.
name: intraday

on:
  schedule:
    - cron: "2-59/5 7-20 * * 1-5"  # :02, :07, ... :57 UTC. Off the hour: on-the-hour runs start late most often.
  workflow_dispatch:  # a "Run workflow" button, for testing
    inputs:
      force_backup:
        description: "Run the digest backup now, whatever the time (to test it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: intraday
  cancel-in-progress: true  # a new run replaces an old one still going, so runs never pile up

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATA_DIR: markets-digest-data
    steps:
      # First, as checking out the code empties the folder (it would delete a restored state/).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # state/ holds the last run's latest.json and how many runs in a row have failed.
      # Keys can't be overwritten, so each run saves a new one and the newest "state-" is restored.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Back off after a failure
        id: gate
        run: |
          fails=$(cat state/fails 2>/dev/null || echo 0)
          # After a failed run (e.g. Yahoo rate-limiting us), skip every other run: every 10 minutes.
          if [ "$fails" -gt 0 ] && [ $(( ${{ github.run_number }} % 2 )) = 1 ]; then
            echo "::warning::$fails failed run(s) in a row: backing off to every 10 minutes"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # This step, setup-python and the fetch may fail without failing the run: see "Fail loudly".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: data
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        with:
          repository: zsombitakacs-dev/markets-digest-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: markets-digest-data
          sparse-checkout: data  # the price history and latest.json; not digests or exports
          persist-credentials: false  # no stored token: only the digest backup pushes, passing it itself

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch and calculate
        id: run
        if: steps.gate.outputs.skip != 'true' && steps.data.outcome == 'success' && steps.python.outcome == 'success'
        continue-on-error: true  # one failed run is not worth an email (a skipped one counts as failed)
        run: |
          pip install --quiet -r requirements.txt
          if [ -f state/latest.json ]; then cp state/latest.json "$DATA_DIR/data/latest.json"; fi
          python -m pipeline.run

      # The dashboard: site/ plus latest.json and a year of chart data, pushed to Cloudflare Pages
      # (behind Cloudflare Access). The token can only edit Pages projects in this account.
      - name: Build the dashboard
        id: site
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: python -m pipeline.site_data

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        id: deploy
        if: steps.site.outcome == 'success'
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy _site --project-name=markets-digest --branch=main --commit-dirty=true

      # Backup for the 14:45 digest, in case the pre-digest run starts late or not at all.
      # schedule_gate reads the committed latest.json (not this run's) to see whether today's is there.
      - name: Digest backup (14:30-14:40 London, only if pre-digest has not committed)
        if: steps.run.outcome == 'success'
        continue-on-error: true  # a failed backup leaves the digest's own staleness warning
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          FORCE: ${{ inputs.force_backup }}  # empty on scheduled runs
        run: |
          due=$(git -C "$DATA_DIR" show HEAD:data/latest.json 2>/dev/null | python -m pipeline.schedule_gate backup)
          if [ "$FORCE" = true ]; then due=true; fi
          if [ "$due" != true ]; then echo "backup not needed"; exit 0; fi
          python -m pipeline.email_tables
          cd "$DATA_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Pre-digest data $(date -u +%Y-%m-%dT%H:%MZ) (intraday backup)"
          url="https://x-access-token:${TOKEN}@github.com/zsombitakacs-dev/markets-digest-data.git"
          if ! git pull --quiet --rebase "$url" main; then
            git rebase --abort
            echo "::warning::Digest backup not pushed: the data repo changed meanwhile (the pre-digest run probably just committed)."
            exit 0
          fi
          git push --quiet "$url" HEAD:main
          echo "::notice::Digest backup committed: the pre-digest run had not committed today's data by now."

      - name: Count failures in a row
        id: count
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p state
          if [ "${{ steps.run.outcome }}" = success ] && [ "${{ steps.deploy.outcome }}" = success ]; then fails=0; else fails=$(( $(cat state/fails 2>/dev/null || echo 0) + 1 )); fi
          echo "$fails" > state/fails
          echo "fails=$fails" >> "$GITHUB_OUTPUT"
          # Email at the 3rd failure in a row, then every 12th (about every 2 hours at the backed-off pace).
          if [ "$fails" = 3 ] || { [ "$fails" -gt 0 ] && [ $(( fails % 12 )) = 0 ]; }; then echo "loud=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f "$DATA_DIR/data/latest.json" ]; then cp "$DATA_DIR/data/latest.json" state/; fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.skip != 'true'
        with:
          path: state
          key: state-${{ github.run_id }}

      # A failed run makes GitHub email the repo owner, so only some failures fail the run.
      - name: Fail loudly
        if: steps.count.outputs.loud == 'true'
        run: |
          echo "::error::${{ steps.count.outputs.fails }} intraday runs in a row have failed. Open the latest failed run's 'Fetch and calculate' step to see why."
          exit 1
