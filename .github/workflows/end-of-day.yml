# Daily at 22:00 UTC, after the European and US closes: save the dated snapshot, append the
# closes to history/prices.csv, update latest.json, commit to the data repo. Weekend digests read this.
name: end-of-day

on:
  schedule:
    - cron: "4 22 * * *"  # 22:04 UTC: a few minutes off the hour, when runs start late most often
  workflow_dispatch:

permissions:
  contents: read  # this repo is only read; the data repo is written with DATA_REPO_TOKEN

concurrency:
  group: data-repo  # shared with pre-digest, so two runs never push at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATA_DIR: markets-digest-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zsombitakacs-dev/markets-digest-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: markets-digest-data
          sparse-checkout: data

      # The newest latest.json from any run (on weekdays, the last intraday one), so
      # crossings, suspect checks and the options block continue from it. See intraday.yml.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch and calculate
        run: |
          pip install --quiet -r requirements.txt
          if [ -f state/latest.json ]; then cp state/latest.json "$DATA_DIR/data/latest.json"; fi
          python -m pipeline.run --close

      - name: Commit to the data repo
        if: ${{ !cancelled() }}  # also after a run with most values missing: the digest says what is unavailable
        working-directory: markets-digest-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit --quiet -m "End-of-day data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --quiet --rebase  # in case the digest task pushed meanwhile
          git push --quiet

      # The last intraday run is at 20:57 UTC, before the US close: redeploy the dashboard with
      # the closing prices, so evenings and weekends show them. See intraday.yml.
      - name: Build the dashboard
        if: ${{ !cancelled() }}
        run: python -m pipeline.site_data

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        if: ${{ !cancelled() }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy _site --project-name=markets-digest --branch=main --commit-dirty=true

      - name: Keep the newest latest.json for the next run
        if: ${{ !cancelled() }}
        run: mkdir -p state && cp "$DATA_DIR/data/latest.json" state/

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: state
          key: state-${{ github.run_id }}
