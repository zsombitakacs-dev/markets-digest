# GitHub pauses scheduled workflows in a public repo after 60 days without activity, and the
# daily commits go to the private data repo. So once a month, commit a date to this repo.
name: keep-alive

on:
  schedule:
    - cron: "17 6 1 * *"  # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write  # the only workflow that writes to this repo

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Commit status/last_run.txt
        run: |
          echo "keep-alive commit: $(date -u +%Y-%m-%dT%H:%MZ)" > status/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "Monthly keep-alive"
          git push --quiet
